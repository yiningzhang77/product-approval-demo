<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>我的申请</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: merchantSidebar}"></div>
    <main class="content">
        <header class="page-header">
            <div>
                <div class="page-title">我的申请</div>
                <div class="breadcrumb">商家端 / 我的申请</div>
            </div>
        </header>
        <section class="page-body">
            <section class="filter-panel">
                <form th:action="@{/merchant/applications}" method="get">
                    <input type="hidden" name="merchantId" th:value="${merchant.id}">
                    <div class="filter-grid">
                        <div class="field">
                            <label>商品名称</label>
                            <input type="text" name="keyword" th:value="${query.keyword}" placeholder="请输入商品名称">
                        </div>
                        <div class="field">
                            <label>商品分类</label>
                            <select name="categoryId">
                                <option value="">全部分类</option>
                                <option th:each="category : ${categories}" th:value="${category.id}" th:selected="${query.categoryId == category.id}" th:text="${category.name}"></option>
                            </select>
                        </div>
                        <div class="field">
                            <label>审批状态</label>
                            <select name="status">
                                <option value="">全部状态</option>
                                <option value="PENDING" th:selected="${query.status != null and query.status.name() == 'PENDING'}">待审批</option>
                                <option value="APPROVED" th:selected="${query.status != null and query.status.name() == 'APPROVED'}">已通过</option>
                                <option value="REJECTED" th:selected="${query.status != null and query.status.name() == 'REJECTED'}">已驳回</option>
                            </select>
                        </div>
                        <div class="field">
                            <label>是否告警</label>
                            <select name="warning">
                                <option value="">全部</option>
                                <option value="true" th:selected="${query.warning == true}">是</option>
                                <option value="false" th:selected="${query.warning == false}">否</option>
                            </select>
                        </div>
                    </div>
                    <div class="actions">
                        <button type="submit">搜索</button>
                        <a class="button secondary" th:href="@{/merchant/applications(merchantId=${merchant.id})}">重置</a>
                    </div>
                </form>
            </section>

            <section class="table-panel">
                <nav class="status-tabs">
                    <a th:href="@{/merchant/applications(merchantId=${merchant.id})}">全部</a>
                    <a th:href="@{/merchant/applications(merchantId=${merchant.id},status='PENDING')}">待审批</a>
                    <a th:href="@{/merchant/applications(merchantId=${merchant.id},status='APPROVED')}">已通过</a>
                    <a th:href="@{/merchant/applications(merchantId=${merchant.id},status='REJECTED')}">已驳回</a>
                    <a th:href="@{/merchant/applications(merchantId=${merchant.id},warning=true)}">价格告警</a>
                </nav>
                <div class="empty" th:if="${#lists.isEmpty(applications)}">暂无申请数据</div>
                <div class="table-wrap" th:if="${!#lists.isEmpty(applications)}">
                    <table>
                        <thead>
                        <tr>
                            <th>申请ID</th>
                            <th>商品分类</th>
                            <th>商品名称</th>
                            <th>价格</th>
                            <th>状态</th>
                            <th>是否告警</th>
                            <th>告警原因</th>
                            <th>申请时间</th>
                            <th>审批时间</th>
                            <th>审批备注</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${applications}">
                            <td th:text="${item.id}"></td>
                            <td th:text="${item.categoryName}"></td>
                            <td th:text="${item.productName}"></td>
                            <td th:text="${item.price}"></td>
                            <td><span class="status" th:classappend="${item.status.name().toLowerCase()}" th:text="${item.status}"></span></td>
                            <td><span class="warning-badge" th:classappend="${item.warning} ? 'yes' : 'no'" th:text="${item.warning} ? '是' : '否'"></span></td>
                            <td class="text" th:text="${item.warningReason}"></td>
                            <td th:text="${#temporals.format(item.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
                            <td th:text="${item.approvedAt == null ? '' : #temporals.format(item.approvedAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
                            <td class="text" th:text="${item.approvalRemark}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="footer-actions">
                    <a class="button" th:href="@{/merchant/applications/export(merchantId=${merchant.id},categoryId=${query.categoryId},keyword=${query.keyword},status=${query.status},warning=${query.warning})}">导出当前筛选结果 CSV</a>
                </div>
            </section>
        </section>
    </main>
</div>
</body>
</html>
